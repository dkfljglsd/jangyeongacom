<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>동시통역 통화</title>
<link rel="stylesheet" href="style.css?v=12" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🗣️</text></svg >" />
</head>
<body>

<!-- ───────── 1. 대기 / 걸기 ───────── -->
<section id="home" class="screen">
  <div class="card">
    <div class="card-head">
      <div class="logo">🗣️</div>
      <h1>동시통역 통화</h1>
      <p class="sub">서로 자기 말로 하면 상대에게는 상대 말로 들립니다.</p>
    </div>

    <div class="mynum">
      <span class="mynum-label">내 번호<br /><i id="online" class="off">○ 연결 중…</i></span>
      <b id="myId">------</b>
      <button id="copyId" class="ghost small">복사</button>
    </div>
    <p class="hint tight">이 번호를 상대에게 알려주면 상대가 전화를 걸 수 있습니다.</p>

    <label>상대 번호
      <div class="row">
        <input id="dial" placeholder="123456" inputmode="numeric" autocomplete="off" maxlength="6" />
        <button id="callBtn" class="call-btn" title="전화 걸기">📞</button>
      </div>
    </label>

    <details class="adv" id="setup">
      <summary>내 설정</summary>
      <div class="adv-body">
        <label>내 이름
          <input id="name" placeholder="장영아" autocomplete="off" />
        </label>
        <label>내가 말하는 언어
          <select id="mylang"></select>
        </label>
        <label>번역 모델
          <select id="model"><option>불러오는 중…</option></select>
        </label>
        <label>번역 서버 주소
          <input id="api" placeholder="https://translate-api.example.com" autocomplete="off" spellcheck="false" />
        </label>
      </div>
    </details>

    <div id="health" class="health"></div>
  </div>
</section>

<!-- ───────── 2. 거는 중 / 받는 중 ───────── -->
<section id="ring" class="screen hidden">
  <div class="ring-inner">
    <div class="ring-avatar" id="ringAvatar">🙂</div>
    <b id="ringName">…</b>
    <span id="ringState">전화 거는 중…</span>

    <div class="ring-actions">
      <button id="rejectBtn" class="round-btn reject hidden" title="거절">✕</button>
      <button id="acceptBtn" class="round-btn accept hidden" title="받기">📞</button>
      <button id="cancelBtn" class="round-btn reject" title="취소">✕</button>
    </div>
  </div>
</section>

<!-- ───────── 3. 통화 중 ───────── -->
<section id="call" class="screen hidden">

  <div class="callhead">
    <div class="avatar peer-av" id="peerAvatar">🙂</div>
    <b id="peerLabel">상대</b>
    <span id="roomLabel">00:00</span>
    <span id="statusDot" class="dot"></span>
  </div>

  <div id="banner" class="banner hidden">
    <span></span>
    <button id="bannerFix">설정</button>
  </div>

  <main id="log" class="log">
    <div class="empty">
      <div class="empty-emoji">💬</div>
      말을 시작하면 자막이 여기에 쌓입니다.
    </div>
  </main>

  <div id="liveBar" class="live hidden">
    <span class="typing"><i></i><i></i><i></i></span>
    <span id="liveText"></span>
  </div>

  <footer class="callbar">
    <button id="micBtn" class="ctrl" title="마이크">
      <span class="ctrl-icon">🎤</span>
      <span class="ctrl-label" id="micState">음소거</span>
    </button>
    <button id="menuBtn" class="ctrl" title="설정">
      <span class="ctrl-icon">⋯</span>
      <span class="ctrl-label">설정</span>
    </button>
    <button id="hangup" class="ctrl end" title="통화 종료">
      <span class="ctrl-icon">📵</span>
      <span class="ctrl-label">종료</span>
    </button>
  </footer>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-bg" id="sheetBg"></div>
    <div class="sheet-panel">
      <div class="sheet-grip"></div>
      <h3>통화 설정</h3>
      <label class="toggle"><span>상대 목소리 듣기</span><input type="checkbox" id="rawOn" checked /></label>
      <label class="slider"><span>수화기 볼륨</span><input type="range" id="vol" min="0" max="100" value="80" /></label>
      <label class="stack">번역 서버 주소
        <input id="api2" placeholder="https://translate-api.example.com" autocomplete="off" spellcheck="false" />
      </label>
      <button id="sheetClose" class="primary">닫기</button>
    </div>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>
</section>

<script src="app.js?v=12"></script>
</body>
</html>
