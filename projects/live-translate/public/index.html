<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>동시통역 통화</title>
<link rel="stylesheet" href="style.css?v=7" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🗣️</text></svg >" />
</head>
<body>

<!-- ───────── 입장 화면 ───────── -->
<section id="lobby" class="screen">
  <div class="card">
    <div class="card-head">
      <div class="logo">🗣️</div>
      <h1>동시통역 통화</h1>
      <p class="sub">통화하면서 서로의 말이 실시간 번역됩니다.<br />번역은 내 서버의 Ollama에서 돌아갑니다.</p>
    </div>

    <label>방 이름
      <div class="row">
        <input id="room" placeholder="예: kaeri-meeting" autocomplete="off" />
        <button id="dice" class="ghost" title="무작위 방 이름">🎲</button>
      </div>
    </label>

    <label>내 이름
      <input id="name" placeholder="장영아" autocomplete="off" />
    </label>

    <label>내가 말하는 언어
      <select id="mylang"></select>
    </label>

    <label>번역 모델
      <select id="model"><option>불러오는 중…</option></select>
    </label>

    <details class="adv">
      <summary>번역 서버 주소</summary>
      <input id="api" placeholder="https://translate-api.example.com" autocomplete="off" spellcheck="false" />
      <p class="hint">비워두면 이 페이지를 준 서버를 씁니다. 정적 호스팅에 올린 경우, Ollama가 돌아가는 내 서버 주소를 넣으세요.</p>
    </details>

    <button id="join" class="primary">통화 시작</button>

    <div id="health" class="health"></div>
    <p class="hint">같은 방 이름을 상대에게 알려주면 접속됩니다. 링크를 그대로 공유해도 됩니다.</p>
  </div>
</section>

<!-- ───────── 통화 화면 ───────── -->
<section id="call" class="screen hidden">

  <header class="chatbar">
    <button id="hangup" class="iconbtn" title="통화 종료">‹</button>
    <div class="peer">
      <div class="avatar peer-av" id="peerAvatar">🙂</div>
      <div class="peer-meta">
        <b id="peerLabel">상대 기다리는 중…</b>
        <span id="roomLabel"></span>
      </div>
    </div>
    <div class="bar-right">
      <span id="statusDot" class="dot"></span>
      <button id="menuBtn" class="iconbtn" title="설정">⋯</button>
    </div>
  </header>

  <div id="banner" class="banner hidden">
    <span></span>
    <button id="bannerFix">설정</button>
  </div>

  <main id="log" class="log">
    <div class="empty">
      <div class="empty-emoji">🎧</div>
      말을 시작하면 원문과 번역이 함께 나타납니다.
    </div>
  </main>

  <div id="liveBar" class="live hidden">
    <span class="typing"><i></i><i></i><i></i></span>
    <span id="liveText"></span>
  </div>

  <footer class="composer">
    <button id="micBtn" class="micbtn" title="마이크 켜기/끄기">🎤</button>
    <div class="field"><span id="micState">듣는 중</span></div>
    <button id="copyLink" class="iconbtn round" title="초대 링크 복사">🔗</button>
  </footer>

  <!-- 설정 시트 -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-bg" id="sheetBg"></div>
    <div class="sheet-panel">
      <div class="sheet-grip"></div>
      <h3>통화 설정</h3>
      <label class="toggle"><span>번역 음성 읽기</span><input type="checkbox" id="ttsOn" checked /></label>
      <label class="toggle"><span>상대 원음 듣기</span><input type="checkbox" id="rawOn" checked /></label>
      <label class="slider"><span>원음 볼륨</span><input type="range" id="vol" min="0" max="100" value="55" /></label>
      <label class="stack">번역 서버 주소
        <input id="api2" placeholder="https://translate-api.example.com" autocomplete="off" spellcheck="false" />
      </label>
      <button id="sheetClose" class="primary">닫기</button>
    </div>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>
</section>

<script src="app.js?v=7"></script>
</body>
</html>
